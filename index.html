<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEB HỌC HÓA HỌC CỦA KHOA NGUYỄN</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b4b;--ink2:#3f3d56;--muted:#6b7280;--line:#e4e4f7;--pur:#6d28d9;--pur-s:#ede9fe;--teal:#0f766e;--teal-s:#ccfbf1;--amb:#b45309;--amb-s:#fef3c7;--grn:#15803d;--grn-s:#dcfce7;--pink:#be185d;--pink-s:#fce7f3;--blue:#1d4ed8;--blue-s:#dbeafe}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito",system-ui,sans-serif;color:var(--ink);font-size:16.5px;line-height:1.65;background:linear-gradient(120deg,#f5f3ff,#eef6ff,#fdf2f8,#f5f3ff);background-size:400% 400%;animation:bg 18s ease infinite}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700}
h1,h2,h3,.fred{font-family:"Fredoka",sans-serif;font-weight:600;margin:0}
header{background:linear-gradient(135deg,#4c1d95,#6d28d9 45%,#4338ca 80%,#2563eb);color:#fff;padding:24px 16px;text-align:center}
header h1{font-size:1.6rem;letter-spacing:.5px;text-transform:uppercase}
header p{margin:6px 0 0;color:#ddd6fe}
nav.tabs{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:8px;box-shadow:0 2px 10px rgba(30,27,75,.06)}
.tab{border:none;background:none;font:inherit;font-weight:800;padding:9px 15px;border-radius:999px;cursor:pointer;color:var(--ink2);transition:.2s}
.tab:hover{background:var(--pur-s);color:var(--pur)}
.tab.active{background:var(--pur);color:#fff;box-shadow:0 6px 16px rgba(109,40,217,.3)}
main{max-width:880px;margin:0 auto;padding:18px 14px 50px}
.hidden{display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(30,27,75,.07)}
h2{font-size:1.45rem;color:var(--pur);margin-bottom:10px}
h3{font-size:1.1rem;margin:16px 0 8px}
p{margin:8px 0}
.enter{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pill{display:inline-block;font-size:.8rem;font-weight:800;padding:3px 11px;border-radius:999px;margin-right:6px}
.c-pur{background:var(--pur-s);color:var(--pur)}.c-teal{background:var(--teal-s);color:var(--teal)}.c-amb{background:var(--amb-s);color:var(--amb)}.c-pink{background:var(--pink-s);color:var(--pink)}.c-grn{background:var(--grn-s);color:var(--grn)}.c-blue{background:var(--blue-s);color:var(--blue)}
.callout{border-radius:14px;padding:12px 16px;margin:14px 0;font-weight:700}
.callout.pur{background:var(--pur-s);color:#3b0764}.callout.amb{background:var(--amb-s);color:#78350f}.callout.grn{background:var(--grn-s);color:#14532d}
table{width:100%;border-collapse:collapse;margin:12px 0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.96rem}
th,td{padding:9px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--pur-s);color:var(--pur)}
td.l{text-align:left}
/* hoạt ảnh nguyên lý */
.stage{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin:16px 0}
.chip{background:#fff;border:2px solid var(--pur);border-radius:16px;padding:10px 16px;font-weight:800;font-size:1.05rem;transition:transform .3s}
.chip:hover{transform:translateY(-3px) scale(1.04)}
.chip.H{animation:fadeH 3s ease-in-out infinite}
.chip.R{animation:popR 3s ease-in-out infinite}
@keyframes fadeH{0%,40%{opacity:1;transform:scale(1)}50%,90%{opacity:.15;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
@keyframes popR{0%,40%{opacity:.15;transform:scale(.8)}50%,90%{opacity:1;transform:scale(1.08)}100%{opacity:.15;transform:scale(.8)}}
.arrowA{font-size:1.8rem;color:var(--pur);font-weight:900;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.bacrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.bacbox{border-radius:16px;padding:12px 8px;text-align:center;border:2px solid;transition:transform .3s}
.bacbox:hover{transform:translateY(-4px)}
.bacbox .f{font-family:"JetBrains Mono",monospace;font-weight:700;margin-top:4px}
.bacbox.b1{border-color:#8b5cf6;background:#f5f3ff}.bacbox.b2{border-color:#14b8a6;background:#f0fdfa}.bacbox.b3{border-color:#f43f5e;background:#fff1f2}
.diagrams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:14px 0}
.dbox{background:#faf8ff;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.dbox .cap{font-weight:800;color:var(--ink2);font-size:.95rem;margin-top:4px}
svg.diag,svg.bz{width:100%;max-width:300px;height:auto;overflow:visible}
svg.bz .ring{transform-box:fill-box;transform-origin:center;transition:transform .8s}
.dbox:hover svg.bz .ring{transform:rotate(60deg)}
.pulseN{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.flow{stroke-dasharray:8 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.draw{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* bung công thức */
.gop{display:inline-block;cursor:pointer;background:var(--teal-s);color:#134e4a;border-radius:10px;padding:2px 9px;font-family:"JetBrains Mono",monospace;font-weight:700;transition:.2s}
.gop:hover{background:#99f6e4;transform:scale(1.05)}
.bung{display:none;margin-top:8px;background:#0f172a;color:#e2e8f0;border-radius:14px;padding:12px 14px;font-family:"JetBrains Mono",monospace;font-size:.95rem;line-height:1.35;white-space:pre}
.bung.show{display:block}
.bung span{opacity:0;display:block;animation:typeln .4s ease forwards}
@keyframes typeln{to{opacity:1}}
.bung .hint{color:#94a3b8;font-family:"Nunito",sans-serif;white-space:normal;font-size:.85rem}
/* thứ tự học */
.progress{height:10px;background:#e9e5ff;border-radius:99px;overflow:hidden;margin-bottom:8px}
.progress-bar{height:100%;background:linear-gradient(90deg,#a78bfa,#6d28d9,#a78bfa);background-size:200% 100%;animation:sh 2.4s linear infinite;transition:width .5s}
@keyframes sh{from{background-position:0 0}to{background-position:200% 0}}
.stepcount{font-weight:800;color:var(--ink2);text-align:right;margin-bottom:10px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:#d6d3f5;border:none;padding:0}
.dot.on{background:var(--pur);transform:scale(1.35)}.dot.done{background:#a78bfa}
.lock{text-align:center;color:var(--muted);font-weight:800;padding:14px;border:2px dashed #c4b5fd;border-radius:16px;margin-top:14px}
.practice{margin-top:20px;border-top:2px dashed #c4b5fd;padding-top:16px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.qtext{font-weight:800;margin:8px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{text-align:left;padding:11px 13px;border:2px solid var(--line);border-radius:13px;background:#fff;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:#8b5cf6;background:#faf8ff;transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.correct{border-color:#22c55e;background:#dcfce7;animation:pop .4s}
.opt.wrong{border-color:#f43f5e;background:#ffe4e6;animation:shake .4s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.exp{margin-top:10px;padding:11px 13px;border-radius:13px;font-weight:600;font-size:.96rem;animation:up .4s both}
.exp.ok{background:#dcfce7;color:#14532d}.exp.bad{background:#ffe4e6;color:#881337}
.scorebox{text-align:center;background:linear-gradient(135deg,#faf8ff,#eff6ff);border:2px solid #a78bfa;border-radius:20px;padding:20px;margin:8px 0 14px;animation:up .5s both}
.scorebox .big{font-family:"Fredoka",sans-serif;font-size:2.4rem;color:var(--pur)}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:none;border-radius:16px;padding:14px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;cursor:pointer;background:linear-gradient(135deg,#7c3aed,#4338ca);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.28);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;color:var(--pur);border:2px solid #c4b5fd;box-shadow:none}
.picker{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.pk{border:2px solid #c4b5fd;background:#fff;color:var(--pur);border-radius:14px;padding:9px 14px;font:inherit;font-weight:800;cursor:pointer}
.pk.on{background:var(--pur);color:#fff}
.group{margin-bottom:14px}
.iso-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.iso{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:transform .2s}
.iso:hover{transform:translateY(-3px)}
.iso .fx{font-family:"JetBrains Mono",monospace;font-weight:700;word-break:break-word}
.nm{border-radius:11px;padding:7px 10px;font-weight:800;cursor:pointer}
.nm.gc{background:var(--teal-s);color:#134e4a}.nm.tt{background:var(--pur-s);color:#3b0764}
.nm .lab{display:block;font-size:.68rem;text-transform:uppercase;opacity:.8}
.nm .val{transition:filter .3s}
body.hidenames .nm .val{filter:blur(7px);user-select:none}
body.hidenames .nm.open .val{filter:none}
.isonav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.step-f{border:2px solid var(--line);background:#fff;border-radius:12px;padding:7px 11px;font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--muted)}
.step-f.done{border-color:#a78bfa;color:var(--pur)}.step-f.now{background:var(--pur);color:#fff;border-color:var(--pur)}
.toggle{border:2px solid var(--pur);background:#fff;color:var(--pur);border-radius:12px;padding:8px 13px;font:inherit;font-weight:800;cursor:pointer}
.toggle.on{background:var(--pur);color:#fff}
.common{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:8px}
.common .row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 13px}
@media(max-width:560px){.opts{grid-template-columns:1fr}.bacrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>WEB HỌC HÓA HỌC CỦA KHOA NGUYỄN</h1>
  <p>Chuyên đề 7 · Amin · Học theo thứ tự, luyện tập sau mỗi phần</p>
</header>
<nav class="tabs">
  <button class="tab active" id="t-learn" onclick="showTab('learn')">📖 Lý thuyết & Gọi tên</button>
  <button class="tab" id="t-7a" onclick="showTab('7a')">📄 Trích từ chuyên đề 7A</button>
  <button class="tab" id="t-ext" onclick="showTab('ext')">🚀 Ôn tập (ngoài)</button>
</nav>
<main>
  <section id="learn">
    <div class="progress"><div class="progress-bar" id="pbar"></div></div>
    <div class="stepcount" id="scount"></div>
    <div class="card" id="tcard"></div>
    <div class="dots" id="dots"></div>
    <div class="nav">
      <button class="btn ghost" id="prev" onclick="back()">← Lùi</button>
      <button class="btn" id="next" onclick="fwd()">Tiếp →</button>
    </div>
  </section>
  <section id="7a" class="hidden">
    <div class="card" style="margin-bottom:14px"><h2>Trích từ chuyên đề 7A</h2><p>12 câu trích từ đề gốc. Chọn đáp án để xem đúng/sai và giải thích.</p></div>
    <div id="list-p7a"></div>
    <div id="score-p7a" class="scorebox hidden"></div>
    <div class="nav"><button class="btn ghost" onclick="resetSet('p7a')">🔄 Làm lại</button></div>
  </section>
  <section id="ext" class="hidden">
    <div class="card" style="margin-bottom:14px"><h2>Ôn tập (ngoài)</h2><p>3 đề, mỗi đề 10 câu. Mỗi câu có tag cho biết thuộc phần nào.</p></div>
    <div class="picker">
      <button class="pk on" id="pk-e1" onclick="showExam('e1')">Đề 1 · Khái niệm & bậc</button>
      <button class="pk" id="pk-e2" onclick="showExam('e2')">Đề 2 · CTTQ & đồng phân</button>
      <button class="pk" id="pk-e3" onclick="showExam('e3')">Đề 3 · Danh pháp</button>
    </div>
    <div id="ext-e1"></div><div id="ext-e2" class="hidden"></div><div id="ext-e3" class="hidden"></div>
  </section>
</main>
<script>
/* ===== HÌNH ===== */
function benzene(subs){
  const cx=170,cy=125,r=52,ext=46;
  const pts=[...Array(6)].map((_,i)=>{const a=(-90+60*i)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]});
  let dbl="";
  [0,2,4].forEach(i=>{const a=pts[i],b=pts[(i+1)%6],k=.7;dbl+=`<line x1="${cx+(a[0]-cx)*k}" y1="${cy+(a[1]-cy)*k}" x2="${cx+(b[0]-cx)*k}" y2="${cy+(b[1]-cy)*k}" stroke="#4c1d95" stroke-width="3" stroke-linecap="round"/>`});
  let sub="";
  Object.entries(subs).forEach(([i,label])=>{
    const a=(-90+60*i)*Math.PI/180,p=pts[i];
    const ex=cx+(r+ext)*Math.cos(a),ey=cy+(r+ext)*Math.sin(a),c=Math.cos(a),s=Math.sin(a);
    const an=c>.2?"start":(c<-.2?"end":"middle");
    sub+=`<line class="draw" x1="${p[0]}" y1="${p[1]}" x2="${ex}" y2="${ey}" stroke="#1e1b4b" stroke-width="3"/><text x="${ex+(c>.2?6:(c<-.2?-6:0))}" y="${ey+(s>.5?18:(s<-.5?-6:6))}" text-anchor="${an}" font-size="17" font-weight="800" fill="#6d28d9" font-family="Nunito">${label}</text>`;
  });
  return `<svg class="bz" viewBox="0 0 340 250"><g class="ring"><polygon points="${pts.map(p=>p.join(",")).join(" ")}" fill="#f5f3ff" stroke="#1e1b4b" stroke-width="3" stroke-linejoin="round"/>${dbl}</g>${sub}</svg>`;
}
function bacSVG(bac){
  const slots=bac===1?["R","H","H"]:bac===2?["R","R","H"]:["R","R","R"];
  const angs=[-150,-90,-30],cx=130,cy=108,L=72;let s="";
  slots.forEach((t,i)=>{const a=angs[i]*Math.PI/180,x=cx+L*Math.cos(a),y=cy+L*Math.sin(a);
    s+=`<line class="draw" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#1e1b4b" stroke-width="3"/><circle cx="${x}" cy="${y}" r="21" fill="${t==="R"?"#ede9fe":"#fff"}" stroke="${t==="R"?"#6d28d9":"#94a3b8"}" stroke-width="2.5"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" font-weight="800" fill="${t==="R"?"#6d28d9":"#64748b"}">${t}</text>`});
  s+=`<circle class="pulseN" cx="${cx}" cy="${cy}" r="26" fill="#4338ca"/><text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">N</text>`;
  return `<svg class="diag" viewBox="0 0 260 200">${s}</svg>`;
}
function chainSVG(nC,nhIdx){
  const x=i=>34+i*42,y=i=>i%2===0?70:110;
  const pts=[...Array(nC)].map((_,i)=>[x(i),y(i)]);
  const p=pts[nhIdx],up=p[1]===70,ty=up?22:150;
  return `<svg class="diag" viewBox="0 0 ${34+(nC-1)*42+60} 175"><polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="#1e1b4b" stroke-width="3"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="#6d28d9"/>`).join("")}<line class="flow" x1="${p[0]}" y1="${p[1]}" x2="${p[0]}" y2="${ty+(up?20:-20)}" stroke="#0f766e" stroke-width="3"/><circle class="pulseN" cx="${p[0]}" cy="${ty}" r="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/><text x="${p[0]}" y="${ty+6}" text-anchor="middle" font-size="15" font-weight="800" fill="#134e4a">NH₂</text></svg>`;
}
/* Công thức bung ra: ô bấm được, bung ASCII từng dòng */
function gop(label,lines){
  const id="g"+Math.random().toString(36).slice(2,8);
  const body=lines.map((l,i)=>`<span style="animation-delay:${i*.18}s">${l}</span>`).join("");
  return `<span class="gop" onclick="document.getElementById('${id}').classList.toggle('show')">${label} 🔍</span><div class="bung" id="${id}">${body}<span class="hint">Bấm lại để thu gọn</span></div>`;
}
const EXP={
 metyl:["      H","      |","–N–C–H","      |","      H"],
 etyl:["   H   H   H","   |   |   |","–N–C–C–H","   |   |","   H   H"],
 isopropyl:["         H₃C","        /","–N–C–H","        \\","         H₃C"],
 tert:["        CH₃","        |","–N–C–CH₃","        |","        CH₃"],
 secbutyl:["      H","      |","–N–C–CH₂–CH₃","      |","      CH₃"],
 isobutyl:["   H       CH₃","   |        |","–N–C–C–H","   |        |","   H       CH₃"],
 propyl:["   H   H   H","   |   |   |","–N–C–C–C–H","   |   |   |","   H   H   H"]
};
function G(key,label){return gop(label,EXP[key]);}

/* ===== LÝ THUYẾT: mỗi bước có nhiều trang (slide) học theo thứ tự, rồi mới đến bài tập ===== */
const steps=[
{ title:"Khái niệm amin", slides:[
 ()=>`<p>Lấy <b>NH₃</b> và thay <b>1 nguyên tử H</b> bằng <b>gốc hydrocarbon R</b> → được amin.</p>
  <div class="stage"><div class="chip mono H">H</div><div class="arrowA">→</div><div class="chip mono R">R</div></div>
  <div class="stage"><div class="chip mono">NH₃</div><div class="arrowA">→</div><div class="chip mono">R–NH₂</div></div>
  <div class="callout pur">Hình động: H bị thay bằng R. Phần còn lại NH₂ giữ nguyên.</div>`,
 ()=>`<p>Ví dụ:</p><ul><li>CH₃–NH₂: R = CH₃ → metylamin</li><li>C₂H₅–NH₂: R = C₂H₅ → etylamin</li><li>C₆H₅–NH₂: R = C₆H₅ (vòng benzen) → anilin</li></ul>` ],
 ex:["CH₃–NH₂: R = CH₃","C₂H₅–NH₂: R = C₂H₅","C₆H₅–NH₂: R = C₆H₅"],
 quiz:[
  {tag:"Khái niệm",q:"Thay một H trong NH₃ bằng gốc hydrocarbon được:",o:["ancol","amin","ete","este"],a:1,e:"Đó là định nghĩa amin."},
  {tag:"Khái niệm",q:"Chất nào là amin?",o:["CH₃OH","CH₃CH₂NH₂","CH₃COOH","C₂H₅Cl"],a:1,e:"CH₃CH₂NH₂ có N gắn gốc hydrocarbon."},
  {tag:"Khái niệm",q:"CH₃–NH₂ có tên gốc–chức là:",o:["metanamin","metylamin","đimetylamin","etylamin"],a:1,e:"Gốc metyl + amin = metylamin."}
 ]},
{ title:"Phân loại theo bậc", slides:[
 ()=>`<p><b>Bậc</b> = số gốc R gắn trực tiếp vào N. Chỉ đếm gốc trên N.</p>
  <div class="diagrams"><div class="dbox">${bacSVG(1)}<div class="cap">Bậc 1: 1 gốc R</div></div><div class="dbox">${bacSVG(2)}<div class="cap">Bậc 2: 2 gốc R</div></div><div class="dbox">${bacSVG(3)}<div class="cap">Bậc 3: 3 gốc R</div></div></div>`,
 ()=>`<div class="bacrow"><div class="bacbox b1"><b>Bậc 1</b><div class="f">R–NH₂</div></div><div class="bacbox b2"><b>Bậc 2</b><div class="f">R–NH–R'</div></div><div class="bacbox b3"><b>Bậc 3</b><div class="f">R–N(R')–R''</div></div></div>

function itemsHTML(p){
  return SETS[p].map((it,i)=>`<div class="qcard enter" id="qc-${p}-${i}"><span class="pill ${TAGCLS[it.tag]||"c-pur"}">${it.tag}</span>
   <div class="qtext">${it.q}</div><div class="opts">${it.o.map((o,oi)=>`<button class="opt" onclick="pick('${p}',${i},${oi})">${"ABCD"[oi]}. ${o}</button>`).join("")}</div><div id="qe-${p}-${i}"></div></div>`).join("");
}
function pick(p,i,oi){
  ANS[p]=ANS[p]||{}; if(ANS[p][i]!==undefined) return; ANS[p][i]=oi; applyAns(p,i,oi); checkDone(p);
}
function applyAns(p,i,oi){
  const it=SETS[p][i], card=document.getElementById(`qc-${p}-${i}`); if(!card) return;
  card.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true; if(k===it.a) b.classList.add("correct"); if(k===oi&&oi!==it.a) b.classList.add("wrong");});
  document.getElementById(`qe-${p}-${i}`).innerHTML=`<div class="exp ${oi===it.a?"ok":"bad"}"><b>${oi===it.a?"✅ Đúng!":"❌ Chưa đúng."}</b> ${it.e}</div>`;
}
function checkDone(p){
  const el=document.getElementById("score-"+p); if(!el) return;
  const got=ANS[p]||{}, items=SETS[p];
  if(Object.keys(got).length<items.length) return;
  const sc=items.reduce((s,it,i)=>s+(got[i]===it.a?1:0),0);
  el.innerHTML=`<div style="font-weight:800">Kết quả</div><div class="big">${sc} / ${items.length}</div>`;
  el.classList.remove("hidden");
}
function resetSet(p){
  ANS[p]={}; document.getElementById("list-"+p).innerHTML=itemsHTML(p);
  const el=document.getElementById("score-"+p); el.classList.add("hidden"); el.innerHTML="";
}

/* ===== RENDER LÝ THUYẾT THEO TRÌNH TỰ ===== */
let cur=0, sub=0;
// Một bước gồm các trang (slides) rồi mới đến bài tập. isoSlides = các trang C1..C7.
function pages(s){
  if(s.isoSlides) return ISO_ORDER.map((_,k)=>()=>isoSlideHTML(k));
  return s.slides;
}
function renderPage(){
  const s=steps[cur], pg=pages(s), total=pg.length;
  const onExam = sub>=total;
  let inner="";
  if(!onExam){
    inner=`<h2>${cur+1}. ${s.title}</h2><div class="enter" key="${cur}-${sub}">${pg[sub]()}</div>
    <div class="lock">Trang ${sub+1}/${total}. Học hết các trang thì mới mở bài tập.</div>`;
  } else {
    const ex=(s.ex||[]).map((e,i)=>`<div style="padding:4px 0"><b>${i+1}.</b> <span class="mono">${e}</span></div>`).join("");
    inner=`<h2>${cur+1}. ${s.title}</h2>
      ${ex?`<div class="callout pur"><b>Ví dụ</b>${ex}</div>`:""}
      <div class="practice enter"><div class="fred" style="color:var(--teal);font-size:1.2rem;margin-bottom:8px">🎯 Bài tập</div>
      <div id="list-s${cur}">${itemsHTML("s"+cur)}</div><div id="score-s${cur}" class="scorebox hidden"></div></div>`;
  }
  document.getElementById("tcard").innerHTML=inner;
  if(onExam){ const got=ANS["s"+cur]||{}; Object.keys(got).forEach(i=>applyAns("s"+cur,+i,got[i])); checkDone("s"+cur); }
  document.getElementById("scount").textContent=`Bước ${cur+1}/${steps.length} · Trang ${Math.min(sub+1,total)}/${total}${onExam?" · Bài tập":""}`;
  document.getElementById("pbar").style.width=((cur*100+(onExam?100:(sub/total)*100))/steps.length)+"%";
  document.getElementById("prev").disabled=cur===0&&sub===0;
  const nx=document.getElementById("next");
  const lastStep=cur===steps.length-1;
  if(!onExam){ nx.disabled=false; nx.textContent="Tiếp →"; }
  else { nx.disabled=false; nx.textContent=lastStep?"Sang trích 7A →":"Bước tiếp →"; }
  nx.onclick=()=>onExam?(lastStep?showTab("7a"):jumpStep(cur+1)):fwd();
  // bài tập: chỉ cho đi tiếp khi đã làm hết
  if(onExam){ const n=Object.keys(ANS["s"+cur]||{}).length; if(n<steps[cur].quiz.length){ nx.disabled=true; nx.textContent="Làm hết bài tập để tiếp tục"; } }
  document.getElementById("dots").innerHTML=steps.map((_,i)=>`<button class="dot ${i===cur?"on":(i<cur?"done":"")}" onclick="jumpStep(${i})"></button>`).join("");
  window.scrollTo({top:0,behavior:"smooth"});
}
function fwd(){ const total=pages(steps[cur]).length; if(sub<total){ sub++; renderPage(); } }
function back(){
  if(sub>0){ sub--; renderPage(); }
  else if(cur>0){ cur--; sub=pages(steps[cur]).length; renderPage(); }
}
function jumpStep(i){ cur=i; sub=0; renderPage(); }

/* ===== TAB ===== */
function showTab(n){
  ["learn","7a","ext"].forEach(x=>{document.getElementById(x).classList.toggle("hidden",x!==n); document.getElementById("t-"+x).classList.toggle("active",x===n);});
  window.scrollTo({top:0,behavior:"smooth"});
}
function showExam(k){
  ["e1","e2","e3"].forEach(x=>{document.getElementById("ext-"+x).classList.toggle("hidden",x!==k); document.getElementById("pk-"+x).classList.toggle("on",x===k);});
}

document.getElementById("list-p7a").innerHTML=itemsHTML("p7a");
["e1","e2","e3"].forEach(k=>{
  document.getElementById("ext-"+k).innerHTML=`<div class="card" style="margin-bottom:12px"><h2>${EXAMS[k].name}</h2></div>
   <div id="list-${k}">${itemsHTML(k)}</div><div id="score-${k}" class="scorebox hidden"></div>
   <div class="nav"><button class="btn ghost" onclick="resetSet('${k}')">🔄 Làm lại đề này</button></div>`;
});
renderPage();
